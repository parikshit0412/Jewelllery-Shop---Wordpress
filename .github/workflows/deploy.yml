name: Deploy Theme to Hostinger

on:
  push:
    branches:
      - development
    paths:
      - 'wp-content/themes/jewellery_wp/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  theme-deploy:
    name: Sync Theme to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Deploy Theme via SFTP (SSH)
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: "sftp"
          remote-host: ${{ secrets.SSH_HOST || secrets.FTP_SERVER }}
          remote-port: ${{ secrets.SSH_PORT || 65002 }}
          remote-user: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          local-path: "./wp-content/themes/jewellery_wp"
          remote-path: "/home/u385801108/public_html/wordpress/wp-content/themes/jewellery_wp"
          sync: "full"
