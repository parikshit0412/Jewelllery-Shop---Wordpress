name: Deploy Theme to Hostinger

on:
  push:
    branches:
      - development
    paths:
      - 'wp-content/themes/jewellery_wp/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  theme-deploy:
    name: Sync Theme to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync Theme via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wp-content/themes/jewellery_wp/
          server-dir: public_html/wp-content/themes/jewellery_wp/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
            *.map
