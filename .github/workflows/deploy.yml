name: Deploy to Hostinger

on:
  push:
    branches:
      - development # Change to 'development' if deploying staging/dev branch

jobs:
  web-deploy:
    name: Sync Files to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/ # Target folder on Hostinger
          protocol: ftps # Secure FTPS
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/wp-content/uploads/**
            **/wp-content/cache/**
            **/wp-content/upgrade/**
            wp-config.php
            *.sql
            README.md
            PROJECT_OVERVIEW.md
